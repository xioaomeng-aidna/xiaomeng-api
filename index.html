<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mid Valley - Xiaomeng</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:sans-serif;background:#0b0f14;color:#fff;overflow:hidden}
.top{padding:12px;background:#10161d;z-index:200;position:relative}.row1{display:flex;gap:8px;align-items:center}
.searchbar{flex:1;background:#fff;color:#111;border-radius:999px;padding:10px 12px;font-weight:700;cursor:pointer}
.ai{background:#fff;border:0;border-radius:999px;padding:9px 14px;font-weight:800}.avatar{width:40px;height:40px;border-radius:50%;background:#f0c040;display:flex;align-items:center;justify-content:center;font-size:22px;border:2px solid #fff;cursor:pointer}
.row2{display:flex;gap:8px;margin-top:10px;overflow:auto}.row2 button{white-space:nowrap;border:0;border-radius:999px;padding:8px 14px;background:#1e2a36;color:#fff}.row2 button.on{background:#fff;color:#111;font-weight:800}
.mapwrap{position:relative;height:62vh;overflow:hidden;background:#d9d9d9;touch-action:none}
#gpsMap{position:absolute;inset:0;z-index:1;background:#e8e8e8}#indoorMap{position:absolute;inset:0;background:#e8e8e8 url('map-G.png') center/cover;z-index:2;display:none;touch-action:none;cursor:grab}
.pin{position:absolute;transform:translate(-50%,-100%);background:#fff;color:#111;border-radius:999px;padding:6px 10px;font-size:13px;font-weight:800;box-shadow:0 6px 16px rgba(0,0,0,.4);z-index:5}
.pin.blue{background:#2f7bff;color:#fff}.mydot{position:absolute;width:18px;height:18px;background:#2f7bff;border:3px solid #fff;border-radius:50%;z-index:6;display:none;transform:translate(-50%,-50%)}
.righttools{position:fixed;right:12px;top:150px;z-index:500;display:flex;flex-direction:column;gap:12px;align-items:center}
.rbtn{width:56px;height:56px;border-radius:50%;background:#fff;border:0;box-shadow:0 4px 12px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;cursor:pointer}
.rbtn.big{width:64px;height:64px;font-size:36px;font-weight:900}.rbtn.red{border:3px solid #ff3b30}.rbtn.cyan{border:3px solid #00d4c5;background:#e0fffc}
.rbtn.mapSwitchBtn{border:3px solid #111}.rbtn.mapSwitchBtn.indoorOn{background:#ff9800;color:#fff;border-color:#fff}
.rbtn.relocBtn{background:#111 !important;border:3px solid #fff !important}.rbtn.redpin{font-size:28px}
.rlabel{font-size:11px;background:rgba(0,0,0,.7);border-radius:999px;padding:2px 8px;margin-top:-8px}
.sheet{position:fixed;left:0;right:0;bottom:0;background:#fff !important;color:#111 !important;border-radius:20px 20px 0 0;padding:16px;display:none;z-index:600;max-height:75vh;overflow:auto}
.sheet.show{display:block}.sheet button{width:100%;padding:12px;border-radius:12px;border:1px solid #ddd;background:#fff !important;color:#111 !important;margin-top:8px;font-size:16px;text-align:left}
.sheet button.primary{background:#111 !important;color:#fff !important;text-align:center}.sheet button.cyan{background:#00d4c5 !important;font-weight:800;text-align:center}
.sheet button.orange{background:#ff9800 !important;color:#fff !important;font-weight:800;text-align:center}.sheet input{width:100%;padding:14px;border-radius:12px;border:1px solid #ddd;font-size:16px;background:#f5f5f5}
.drawer{position:fixed;right:0;top:0;bottom:0;width:88%;max-width:360px;background:#fff;color:#111;padding:16px;display:none;z-index:600;overflow:auto}.drawer.show{display:block}
.navbtn{margin:12px;background:#00d4c5;border:0;border-radius:999px;padding:14px;width:calc(100% - 24px);font-weight:800;font-size:16px;position:relative;z-index:400}.navbtn:disabled{background:#333;color:#888}
.badge{position:fixed;left:12px;bottom:80px;background:#111;color:#fff;border-radius:999px;padding:8px 12px;font-size:12px;z-index:400}
.zoomCtl{position:absolute;right:10px;bottom:10px;z-index:10;display:none;flex-direction:column;gap:8px}.zoomCtl button{width:44px;height:44px;border-radius:50%;border:0;background:#fff;font-size:22px;font-weight:900}
.entrance{position:absolute;transform:translate(-50%,-50%);background:#00c853;color:#fff;border-radius:999px;padding:8px 10px;font-size:12px;font-weight:800;z-index:5;border:2px solid #fff}
.route{position:absolute;left:15%;top:30%;width:70%;height:120px;border:3px dashed #ff3b30;border-radius:999px;z-index:4;display:none}
</style>
</head>
<body>
<div class="top"><div class="row1"><div class="searchbar" id="searchBar">🔍 <span id="pillText">搜 Mid Valley / KLCC / 店...</span></div><button class="ai" id="aiBtn">✨ AI</button><div class="avatar" id="avatarBtn">👧</div></div>
<div class="row2"><button class="on">全部</button><button>🚪 入口</button><button>🛗 Elevator</button><button>↗️ Escalator</button><button>🚻 Toilet</button><button>🏬 店</button></div></div>
<div class="mapwrap"><div id="gpsMap"></div><div id="indoorMap"></div><div class="route" id="routeLine"></div><div class="pin" id="myPos" style="left:48%;top:68%;background:#ff3b30;color:#fff;display:none">📍 你在这里</div><div class="mydot" id="myDot" style="left:48%;top:68%"></div><div id="pinLayer"></div><div class="zoomCtl" id="zoomCtl"><button id="zoomIn">+</button><button id="zoomOut">−</button><button id="zoomReset">⟲</button></div><div class="badge" id="statusBadge">📍 正在找你的位置...</div></div>
<div class="righttools">
<button class="rbtn mapSwitchBtn" id="mapFab">🗺️</button>
<button class="rbtn" id="compassBtn">🧭</button>
<button class="rbtn" id="locateBtn">🎯</button>
<button class="rbtn relocBtn" id="pinBtn"><svg width="30" height="30" viewBox="0 0 48 48"><path d="M24 4 C14 4 8 12 8 21 C8 33 24 44 24 44 C24 44 40 33 40 21 C40 12 34 4 24 4 Z" fill="#fff"/><circle cx="24" cy="21" r="8" fill="#111"/><circle cx="24" cy="21" r="3" fill="#fff"/></svg></button>
<button class="rbtn redpin" id="redPinBtn">📌</button>
<button class="rbtn big red" id="floorBtn">G</button><div class="rlabel" id="floorLabel">未确认</div>
</div>
<button class="navbtn" id="navBtn" disabled>先进入室内地图，才能导航</button>
<div class="sheet" id="mapChooseSheet"><h3>🗺️ 换地图</h3><p id="mapChooseHint">你现在在 GPS 地图</p><div style="display:flex;gap:10px"><button id="chooseGPS" style="flex:1;background:#e3f2fd !important;border:2px solid #2f7bff !important;text-align:center !important"><b>🗺️ GPS</b></button><button id="chooseIndoor" style="flex:1;background:#fff3e0 !important;border:2px solid #ff9800 !important;text-align:center !important"><b>🏬 室内 <span id="chooseFloor">G</span></b></button></div><button class="orange" id="chooseBrowse">👀 只是看看室内 - 不在附近也能看</button><button id="closeMapChoose">取消</button></div>
<div class="sheet" id="searchSheet"><h3>🔍 搜索</h3><input id="searchInput" placeholder="打 KLCC / Mid Valley / MAYBANK"><button id="searchGoBtn" class="primary">🔍 搜这个地方</button><div id="searchResults"></div><button id="closeSearchBtn">关闭</button></div>
<div class="sheet" id="browseSheet"><h3>👀 浏览模式</h3><button onclick="showShop('MAYBANK','G楼','东入口','从东入口进，直走 50 米')">🏦 MAYBANK - G楼 · 东入口最近</button><button onclick="showShop('AEON','G楼','西入口','从西入口进')">🛒 AEON - G楼 · 西入口最近</button><button onclick="showShop('厕所','G楼','地铁入口','从地铁入口上 G楼')">🚻 厕所 - G楼</button><button class="primary" id="closeBrowseBtn">我看懂了，关掉</button></div>
<div class="sheet" id="shopSheet"><h3 id="shopTitle">🏦 MAYBANK</h3><p id="shopDetail" style="background:#f5f5f5;border-radius:12px;padding:12px">G楼</p><button class="cyan" id="shopNavBtn">🧭 我到了，开始导航</button><button id="closeShopBtn">继续看看</button></div>
<div class="sheet" id="startNavSheet"><h3>🧭 开始导航？</h3><p>要开始带你去 <b>G 020</b> 吗？</p><button class="cyan" id="startNavYesBtn">是 ✓ 开始带</button><button id="startNavNoBtn">先逛逛</button></div>
<div class="sheet" id="floorSheet"><h3>🔔 请确认楼层</h3><p>你现在在 <b id="selFloor">G楼</b> 吗？</p><button data-floor="LG">LG</button><button data-floor="G">G</button><button data-floor="1">1</button><button data-floor="2">2</button><button data-floor="3">3</button><button class="cyan" id="confirmFloorBtn">确认 ✓ 我在这一层</button><button id="closeFloorBtn">我没换楼</button></div>
<div class="sheet" id="relocSheet"><h3>🔄 重新定位</h3><input id="manualLoc" value="G 020"><button class="primary" id="confirmRelocBtn">校准 ✓ 我在 G 020</button><button id="closeRelocBtn">取消</button></div>
<div class="sheet" id="pinSheet"><h3>📌 加 Marking</h3><input id="pinText" value="我的标记"><button class="primary" id="confirmPinBtn">在地图中间加 Marking ✓</button><button id="closePinBtn">取消</button></div>
<div class="sheet" id="aiSheet"><h3>✨ 问小萌</h3><p id="aiReply" style="background:#f5f5f5;padding:12px;border-radius:12px">你好，我是小萌。</p><div style="display:flex;gap:8px"><input id="aiInput" placeholder="例如 厕所在哪里？" style="flex:1"><button id="aiSend" style="width:70px !important;background:#111 !important;color:#fff !important;text-align:center !important">发送</button></div><button class="primary" id="closeAIBtn">关闭</button></div>
<div class="drawer" id="drawer"><h3>👧 我的小萌</h3><p>📍 我的足迹 - 未确认楼层</p><button id="closeDrawerBtn" style="width:100%;padding:12px;border-radius:12px;background:#111;color:#fff;border:0">关闭</button></div>
<script>
let cur='G',manual='G 020',inIndoor=false,navigating=false,browseMode=false,myLat=null,myLng=null;
const MV={lat:3.1175,lng:101.6772};
const PLACES={'mid valley':[3.1175,101.6772],'midvalley':[3.1175,101.6772],'klcc':[3.1570,101.7110],'klcc park':[3.1570,101.7110],'suria klcc':[3.1570,101.7110],'pavilion':[3.1490,101.7130],'pavilion kl':[3.1490,101.7130],'sunway pyramid':[3.0730,101.6070],'sunway':[3.0730,101.6070],'maybank':[3.1175,101.6772],'aeon':[3.1175,101.6772],'midvalley megamall':[3.1175,101.6772]};
function show(id){document.getElementById(id).classList.add('show')}function hide(id){document.getElementById(id).classList.remove('show')}
function setBadge(t){document.getElementById('statusBadge').innerText=t}
function distM(a,b,c,d){let R=6371000,dx=(c-a)*Math.PI/180,dy=(d-b)*Math.PI/180;let h=Math.sin(dx/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dy/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
let ix=0,iy=0,iscale=1,dragging=false,sx=0,sy=0,startX=0,startY=0;const indoorEl=document.getElementById('indoorMap');
function applyIndoor(){indoorEl.style.transform='translate('+ix+'px,'+iy+'px) scale('+iscale+')'}function resetIndoor(){ix=0;iy=0;iscale=1;applyIndoor()}
indoorEl.addEventListener('pointerdown',e=>{dragging=true;sx=e.clientX;sy=e.clientY;startX=ix;startY=iy;indoorEl.setPointerCapture(e.pointerId)});
indoorEl.addEventListener('pointermove',e=>{if(!dragging)return;ix=startX+(e.clientX-sx);iy=startY+(e.clientY-sy);ix=Math.max(-300,Math.min(300,ix));iy=Math.max(-300,Math.min(300,iy));applyIndoor()});
indoorEl.addEventListener('pointerup',()=>dragging=false);indoorEl.addEventListener('pointercancel',()=>dragging=false);
document.getElementById('zoomIn').onclick=()=>{iscale=Math.min(2.5,iscale+0.25);applyIndoor()};document.getElementById('zoomOut').onclick=()=>{iscale=Math.max(1,iscale-0.25);applyIndoor()};document.getElementById('zoomReset').onclick=resetIndoor;
let gpsMap=L.map('gpsMap').setView([MV.lat,MV.lng],16);let osm=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(gpsMap);
osm.on('tileerror',()=>{try{gpsMap.removeLayer(osm)}catch(e){}L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{maxZoom:19}).addTo(gpsMap)});
L.marker([MV.lat,MV.lng]).addTo(gpsMap).bindPopup('Mid Valley');let meMarker=null,meCircle=null;
function updateFab(){document.getElementById('chooseFloor').innerText=cur;document.getElementById('mapFab').classList.toggle('indoorOn',inIndoor)}
function switchToGPS(){inIndoor=false;browseMode=false;document.getElementById('gpsMap').style.display='block';document.getElementById('indoorMap').style.display='none';document.getElementById('zoomCtl').style.display='none';document.getElementById('routeLine').style.display='none';setTimeout(()=>{gpsMap.invalidateSize();gpsMap.setView([myLat||MV.lat,myLng||MV.lng],16)},200);setBadge('🗺️ GPS · 点右边最上面换地图');document.getElementById('navBtn').disabled=true;document.getElementById('navBtn').innerText='先进入室内地图，才能导航';updateFab()}
function enterBrowseMode(){browseMode=true;inIndoor=true;document.getElementById('indoorMap').style.display='block';document.getElementById('gpsMap').style.display='none';document.getElementById('zoomCtl').style.display='flex';resetIndoor();document.getElementById('indoorMap').innerHTML='<div class="entrance" style="left:50%;top:8%" onclick="showShop(\'东入口\',\'G楼\',\'东入口\',\'这里是东入口\')">🚪 东入口</div><div class="entrance" style="left:8%;top:50%" onclick="showShop(\'西入口\',\'G楼\',\'西入口\',\'这里是西入口\')">🚪 西入口</div><div class="pin" style="left:48%;top:48%;background:#ff3b30;color:#fff">🏦 MAYBANK · G楼</div><div class="pin blue" style="left:25%;top:65%">🛒 AEON</div>';setBadge('👀 浏览模式 · 室内图可以拖');document.getElementById('navBtn').disabled=false;document.getElementById('navBtn').innerText='👀 浏览中 · 点店看入口';updateFab();show('browseSheet')}
function enterIndoor(){browseMode=false;inIndoor=true;document.getElementById('gpsMap').style.display='none';let m=document.getElementById('indoorMap');m.style.display='block';document.getElementById('zoomCtl').style.display='flex';m.innerHTML='';resetIndoor();document.getElementById('myDot').style.display='block';document.getElementById('myPos').style.display='block';setBadge('🏬 室内 '+cur+'楼 · 可以拖');let n=document.getElementById('navBtn');n.disabled=false;n.innerText='开始导航 → 去 '+manual;updateFab();show('startNavSheet')}
function switchToIndoor(){let d=myLat?Math.round(distM(myLat,myLng,MV.lat,MV.lng)):null;if(d===null||d>500){enterBrowseMode();return}enterIndoor()}
function showShop(name,floor,entrance,detail){manual=name;document.getElementById('shopTitle').innerText='🏬 '+name;document.getElementById('shopDetail').innerHTML='<b>'+floor+'</b> · 从 <b>'+entrance+'</b> 进最近<br>'+detail;document.getElementById('routeLine').style.display='block';document.getElementById('pillText').innerText=name+' · '+floor;hide('browseSheet');show('shopSheet')}
function loadGPSPlace(q){let key=q.toLowerCase().trim();hide('searchSheet');let ll=null;for(let k in PLACES){if(key.includes(k)){ll=PLACES[k];break}}if(!ll){alert('搜不到 '+q+'，试试打 KLCC / Pavilion / Mid Valley / Sunway');show('searchSheet');return}gpsMap.setView(ll,16);L.marker(ll).addTo(gpsMap).bindPopup('📍 '+q).openPopup();switchToGPS();setBadge('🗺️ GPS - '+q);document.getElementById('pillText').innerText=q}
function doSearch(){let raw=document.getElementById('searchInput').value.trim();let box=document.getElementById('searchResults');box.innerHTML='';if(!raw){box.innerHTML='<p>打 KLCC / Pavilion / Mid Valley / MAYBANK</p>';return}let opts=[['📍 KLCC - GPS','klcc'],['📍 Pavilion KL - GPS','pavilion'],['📍 Mid Valley - GPS','mid valley'],['📍 Sunway Pyramid - GPS','sunway pyramid'],['🏦 MAYBANK - G楼','maybank']].filter(o=>o[0].toLowerCase().includes(raw.toLowerCase())||raw.toLowerCase().includes(o[1]));if(opts.length==0)opts=[['📍 '+raw+' - GPS',raw]];opts.forEach(o=>{let b=document.createElement('button');b.innerHTML='<b>'+o[0]+'</b>';b.onclick=()=>loadGPSPlace(o[1]);box.appendChild(b)})}
function locateToMe(silent){if(!silent)setBadge('📍 正在找你...');if(!navigator.geolocation){if(!silent)alert('请开 GPS');return}navigator.geolocation.getCurrentPosition(p=>{myLat=p.coords.latitude;myLng=p.coords.longitude;let d=Math.round(distM(myLat,myLng,MV.lat,MV.lng));if(!inIndoor){gpsMap.setView([myLat,myLng],17);if(meMarker)gpsMap.removeLayer(meMarker);if(meCircle)gpsMap.removeLayer(meCircle);meMarker=L.marker([myLat,myLng]).addTo(gpsMap).bindPopup('📍 你在这里').openPopup();meCircle=L.circle([myLat,myLng],{radius:p.coords.accuracy||30,color:'#2f7bff',fillOpacity:0.15}).addTo(gpsMap);setTimeout(()=>gpsMap.invalidateSize(),200);setBadge('📍 已指到你 · 距 Mid Valley '+d+' 米')}else{document.getElementById('myDot').style.display='block';document.getElementById('myPos').style.display='block';document.getElementById('myPos').innerText='📍 你在这里 · '+cur+'楼';setBadge('📍 室内已回到你 · '+cur+'楼')}document.getElementById('pillText').innerText='📍 你在这里 · 距 Mid Valley '+d+' 米'},err=>{if(!silent){setBadge('📍 拿不到位置');alert('拿不到位置，请开 GPS')}else{setBadge('🗺️ GPS · Mid Valley · 点 🎯 回到你');gpsMap.setView([MV.lat,MV.lng],16)}},{enableHighAccuracy:true,timeout:8000})}
document.getElementById('mapFab').onclick=()=>show('mapChooseSheet');
document.getElementById('chooseGPS').onclick=()=>{hide('mapChooseSheet');switchToGPS()};
document.getElementById('chooseIndoor').onclick=()=>{hide('mapChooseSheet');switchToIndoor()};
document.getElementById('chooseBrowse').onclick=()=>{hide('mapChooseSheet');enterBrowseMode()};
document.getElementById('closeMapChoose').onclick=()=>hide('mapChooseSheet');
document.getElementById('searchBar').onclick=()=>{show('searchSheet');doSearch()};
document.getElementById('searchInput').oninput=doSearch;
document.getElementById('searchGoBtn').onclick=()=>{let v=document.getElementById('searchInput').value.trim();if(v)loadGPSPlace(v)};
document.getElementById('closeSearchBtn').onclick=()=>hide('searchSheet');
document.getElementById('closeBrowseBtn').onclick=()=>hide('browseSheet');
document.getElementById('closeShopBtn').onclick=()=>hide('shopSheet');
document.getElementById('shopNavBtn').onclick=()=>{hide('shopSheet');if(browseMode)alert('浏览模式，到了 Mall 再进导航');else show('startNavSheet')};
document.getElementById('startNavYesBtn').onclick=()=>{navigating=true;hide('startNavSheet');setBadge('🧭 导航中')};
document.getElementById('startNavNoBtn').onclick=()=>hide('startNavSheet');
document.getElementById('aiBtn').onclick=()=>show('aiSheet');document.getElementById('closeAIBtn').onclick=()=>hide('aiSheet');
document.getElementById('aiSend').onclick=async()=>{let v=document.getElementById('aiInput').value.trim();if(!v)return;document.getElementById('aiReply').innerText='小萌正在问 Gemini...';try{let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({msg:v,floor:cur})});let d=await r.json();document.getElementById('aiReply').innerText=d.reply||'Gemini 出错了'}catch(e){document.getElementById('aiReply').innerText='连不到 /api/chat'}};
document.getElementById('avatarBtn').onclick=()=>show('drawer');document.getElementById('closeDrawerBtn').onclick=()=>hide('drawer');
document.getElementById('compassBtn').onclick=()=>{if(!inIndoor){gpsMap.setView([myLat||MV.lat,myLng||MV.lng],16);setBadge('🧭 已指北')}else{resetIndoor();setBadge('🧭 室内已指北 · 回到中间')}};
document.getElementById('locateBtn').onclick=()=>locateToMe(false);
document.getElementById('pinBtn').onclick=()=>show('relocSheet');
document.getElementById('redPinBtn').onclick=()=>show('pinSheet');
document.getElementById('closePinBtn').onclick=()=>hide('pinSheet');
document.getElementById('confirmPinBtn').onclick=()=>{let t=document.getElementById('pinText').value.trim()||'我的标记';let d=document.createElement('div');d.className='pin';d.style.left='50%';d.style.top='50%';d.style.background='#ff3b30';d.style.color='#fff';d.innerText='📌 '+t;document.getElementById('pinLayer').appendChild(d);hide('pinSheet')};
document.getElementById('closeRelocBtn').onclick=()=>hide('relocSheet');
document.getElementById('confirmRelocBtn').onclick=()=>{manual=document.getElementById('manualLoc').value.trim()||'G 020';document.getElementById('pillText').innerText=manual;hide('relocSheet')};
document.getElementById('floorBtn').onclick=()=>show('floorSheet');
document.getElementById('closeFloorBtn').onclick=()=>hide('floorSheet');
document.querySelectorAll('#floorSheet [data-floor]').forEach(b=>b.onclick=()=>{cur=b.dataset.floor;document.getElementById('selFloor').innerText=cur+'楼';updateFab()});
document.getElementById('confirmFloorBtn').onclick=()=>{let fb=document.getElementById('floorBtn');fb.innerText=cur;fb.classList.remove('red');fb.classList.add('cyan');document.getElementById('floorLabel').innerText='已确认';hide('floorSheet');setBadge('🏬 室内 '+cur+'楼 已确认');updateFab()};
document.getElementById('navBtn').onclick=()=>{if(browseMode){show('browseSheet');return}if(!inIndoor){show('mapChooseSheet');return}show('startNavSheet')};
// 一打开就自动找你
setTimeout(()=>{gpsMap.invalidateSize();locateToMe(true)},500);updateFab();
</script>
</body>
  </html>
