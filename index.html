body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;background:#0b0f14;color:#fff;overflow:hidden}
.top{padding:12px 12px 8px;background:#10161d;position:relative;z-index:200}
.row1{display:flex;align-items:center;gap:8px}
.searchbar{flex:1;background:#fff;color:#111;border-radius:999px;padding:10px 12px;display:flex;align-items:center;gap:6px;font-weight:700;cursor:pointer}

.ai{background:#fff;border:0;border-radius:999px;padding:9px 14px;font-weight:800;cursor:pointer}
.avatar{width:40px;height:40px;border-radius:50%;background:#f0c040;display:flex;align-items:center;justify-content:center;font-size:22px;border:2px solid #fff;cursor:pointer;position:relative;z-index:201}
.row2{display:flex;gap:8px;margin-top:10px;overflow:auto}
.row2 button{white-space:nowrap;border:0;border-radius:999px;padding:8px 14px;background:#1e2a36;color:#fff;cursor:pointer}
.row2 button.on{background:#fff;color:#111;font-weight:800}
.mapwrap{position:relative;height:62vh;overflow:hidden;background:#d9d9d9}
#gpsMap{position:absolute;inset:0;z-index:1;background:#e8e8e8;width:100%;height:100%}
#indoorMap{position:absolute;inset:0;background-color:#e8e8e8;background-image:url('map-G.png'),linear-gradient(#ccc 1px,transparent 1px),linear-gradient(90deg,#ccc 1px,transparent 1px);background-size:cover,40px 40px,40px 40px;background-position:center;transform:perspective(900px) rotateX(45deg) rotateZ(-8deg) scale(1.25);transform-origin:center;z-index:2;display:none;touch-action:pan-x pan-y}
.pin{position:absolute;transform:translate(-50%,-100%);background:#fff;color:#111;border-radius:999px;padding:6px 10px;font-size:13px;font-weight:800;box-shadow:0 6px 16px rgba(0,0,0,.4);z-index:5}
.pin.blue{background:#2f7bff;color:#fff}
.mydot{position:absolute;width:18px;height:18px;background:#2f7bff;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 8px rgba(47,123,255,.25);z-index:6;display:none;transform:translate(-50%,-50%);pointer-events:none}
.righttools{position:fixed;right:12px;top:150px;z-index:250;display:flex;flex-direction:column;gap:12px;align-items:center}
.rbtn{width:56px;height:56px;border-radius:50%;background:#fff;color:#111;border:0;box-shadow:0 4px 12px rgba(0,0,0,.4);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;position:relative}
.rbtn.big{width:64px;height:64px;border-radius:50%;font-size:36px;font-weight:900}
.rbtn.red{border:3px solid #ff3b30}
.rbtn.cyan{border:3px solid #00d4c5;background:#e0fffc}
.rbtn:active{transform:scale(0.92)}
.rbtn.mapSwitchBtn{border:3px solid #111}
.rbtn.mapSwitchBtn.indoorOn{background:#ff9800;color:#fff;border-color:#fff}
.rbtn.relocBtn{font-size:28px;font-weight:900}
.rbtn.redpin{font-size:28px}
.rlabel{font-size:11px;color:#fff;background:rgba(0,0,0,.7);border-radius:999px;padding:2px 8px;margin-top:-8px}
.sheet{position:fixed;inset:auto 0 0 0;background:#fff !important;color:#111 !important;border-radius:20px 20px 0 0;padding:16px;display:none;z-index:300;max-height:75vh;overflow:auto}
.sheet.show{display:block}
.sheet button{width:100%;padding:12px;border-radius:12px;border:1px solid #ddd;background:#fff !important;color:#111 !important;margin-top:8px;font-size:16px;cursor:pointer;text-align:left}
.sheet button.primary{background:#111 !important;color:#fff !important;text-align:center}
