<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mid Valley - Xiaomeng</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;background:#0b0f14;color:#fff}
.top{padding:12px 12px 8px;background:#10161d;position:sticky;top:0;z-index:10}
.row1{display:flex;align-items:center;gap:8px}
.pill{flex:1;background:#fff;color:#111;border-radius:999px;padding:10px 12px;display:flex;align-items:center;gap:6px;font-weight:700}
.pill small{color:#666;font-weight:400}
.ai{background:#fff;border:0;border-radius:999px;padding:9px 14px;font-weight:800}
.avatar{width:40px;height:40px;border-radius:50%;background:#f0c040;display:flex;align-items:center;justify-content:center;font-size:22px;border:2px solid #fff;cursor:pointer}
.row2{display:flex;gap:8px;margin-top:10px;overflow:auto}
.row2 button{white-space:nowrap;border:0;border-radius:999px;padding:8px 14px;background:#1e2a36;color:#fff}
.row2 button.on{background:#fff;color:#111;font-weight:800}
.mapwrap{position:relative;height:62vh;overflow:hidden;background:#0b0f14}
.map{position:absolute;inset:-10% -20%;background:url('map-G.png') center/cover;transform:perspective(900px) rotateX(38deg) rotateZ(-8deg) scale(1.25);transform-origin:center}
.pin{position:absolute;transform:translate(-50%,-100%);background:#fff;color:#111;border-radius:999px;padding:6px 10px;font-size:13px;font-weight:800;box-shadow:0 6px 16px rgba(0,0,0,.4)}
.pin.blue{background:#2f7bff;color:#fff}
.pin.red{background:#ff3b30;color:#fff}
.pin i{font-style:normal}
.card{margin:12px;background:#fff;color:#111;border-radius:18px;padding:14px;display:flex;gap:10px;align-items:center}
.card b{font-size:18px}.card small{color:#666}
.card button{margin-left:auto;background:#111;color:#fff;border:0;border-radius:999px;padding:10px 16px}
.floorbtn{position:absolute;right:12px;top:12px;z-index:5;background:#fff;color:#111;border:0;border-radius:999px;padding:10px 14px;font-weight:800}
.sheet{position:fixed;inset:auto 0 0 0;background:#fff;color:#111;border-radius:20px 20px 0 0;padding:16px;display:none;z-index:20}
.sheet.show{display:block}
.sheet button{width:100%;padding:12px;border-radius:12px;border:1px solid #ddd;background:#fff;margin-top:8px;font-size:16px}
.sheet button.primary{background:#111;color:#fff}
.drawer{position:fixed;inset:0 0 0 auto;width:88%;max-width:360px;background:#fff;color:#111;padding:16px;display:none;z-index:30;overflow:auto}
.drawer.show{display:block}
.drawer h3{margin:4px 0}.item{border:1px solid #eee;border-radius:12px;padding:10px;margin:8px 0}
</style>
</head>
<body>
<div class="top">
  <div class="row1">
    <div class="pill">📍 MAYBANK <small>G(E)</small></div>
    <button class="ai" onclick="openAI()">✨ AI</button>
    <div class="avatar" onclick="openDrawer()">👧</div>
  </div>
  <div class="row2" id="facRow">
    <button class="on" onclick="filterFac(this,'all')">全部</button>
    <button onclick="filterFac(this,'elevator')">🛗 Elevator</button>
    <button onclick="filterFac(this,'escalator')">↗️ Escalator</button>
    <button onclick="filterFac(this,'toilet')">🚻 Toilet</button>
    <button onclick="filterFac(this,'exit')">🚪 Emergency Exit</button>
  </div>
</div>

<div class="mapwrap">
  <div class="map" id="map"></div>
  <div class="pin" style="left:58%;top:32%" data-type="elevator">🛗 电梯</div>
  <div class="pin blue" style="left:34%;top:52%" data-type="escalator">↗️ 电扶梯</div>
  <div class="pin" style="left:74%;top:58%" data-type="toilet">🚻 厕所</div>
  <div class="pin red" style="left:22%;top:28%" data-type="exit">🚪 安全出口</div>
  <div class="pin" style="left:48%;top:68%;background:#ff3b30;color:#fff">📍 你在这里</div>
  <button class="floorbtn" onclick="openFloor()">G ▾</button>
</div>

<div class="card"><div><b>MAYBANK</b><br><small>East Wing, G(E) - 016</small></div><button onclick="openFloor()">开始导航 →</button></div>

<!-- 楼层 -->
<div class="sheet" id="floorSheet">
  <h3>你现在在哪层？</h3><p>已选择 <b id="selFloor">G楼</b></p>
  <button onclick="sel('LG')">LG</button><button onclick="sel('G')">G</button>
  <button onclick="sel('1')">1</button><button onclick="sel('2')">2</button><button onclick="sel('3')">3</button>
  <button class="primary" onclick="confirmFloor()">确认 ✓ 我在这</button>
  <button onclick="closeFloor()">取消</button>
</div>

<!-- 头像抽屉 - 扫描记录躲在这里 -->
<div class="drawer" id="drawer">
  <h3>👧 我的小萌</h3><p>扫描 / 足迹都躲在这里</p>
  <div class="item"><b>📷 扫描记录</b><br><span id="scanList">暂无，点扫描后会在这里</span></div>
  <div class="item"><b>📍 我的足迹</b><br><span id="trackList">G楼 - MAYBANK 附近</span></div>
  <div class="item"><b>🎁 我的优惠</b><br>MAYBANK 附近有优惠</div>
  <button onclick="closeDrawer()" style="width:100%;padding:12px;border-radius:12px;background:#111;color:#fff;border:0">关闭</button>
</div>

<script>
let cur='G';
function openFloor(){document.getElementById('floorSheet').classList.add('show')}
function closeFloor(){document.getElementById('floorSheet').classList.remove('show')}
function sel(f){cur=f;document.getElementById('selFloor').innerText=f+'楼'}
function confirmFloor(){document.querySelector('.floorbtn').innerText=cur+' ▾';closeFloor();fetch('/tracking',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({floor:cur,x:50,y:50,shop_nearby:'MAYBANK'})})}
function filterFac(btn,type){document.querySelectorAll('#facRow button').forEach(b=>b.classList.remove('on'));btn.classList.add('on');document.querySelectorAll('.pin').forEach(p=>{if(type==='all'||p.dataset.type===type||!p.dataset.type)p.style.display='block';else p.style.display='none'})}
function openDrawer(){document.getElementById('drawer').classList.add('show');fetch('/scan').then(r=>r.json()).then(d=>{if(d.scan&&d.scan.length)document.getElementById('scanList').innerText=JSON.stringify(d.scan.slice(-3))})}
function closeDrawer(){document.getElementById('drawer').classList.remove('show')}
function openAI(){let q=prompt('问小萌：maybank 在哪？');if(q)fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({msg:q,floor:cur})}).then(r=>r.json()).then(d=>alert(d.reply||d.error))}
</script>
</body>
   </html>
